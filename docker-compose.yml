version: "3.8"
services:
  # SQL Database (Postgres) - Cho Booking & Revenue
  postgres:
    image: postgres:16-alpine
    container_name: sql_hotel_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: global_hotel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # NoSQL Database (MongoDB) - Cho Hotel Catalog (AP Priority)
  mongodb:
    image: mongo:latest
    container_name: nosql_catalog_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: